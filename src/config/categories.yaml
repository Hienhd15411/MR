# Category keyword definitions used by src/pipeline/filter.py
#
# Matching rules:
# - keywords are matched as whole words on lower-cased title + snippet
# - VN diacritics are kept; matcher also tries an accent-stripped form
# - the FIRST category whose keywords hit becomes `pre_category`
# - if `players` matches, article is reclassified as players_movement
#   and `player` is filled
# - articles with NO match are kept but flagged status=filtered_out
#
# To tune: add/remove keywords and re-run. Keep keywords specific enough to
# avoid false positives ("AI" alone is fine because of word boundaries, but
# "Be" alone would be too noisy — use "Be Group" / "ứng dụng Be" instead).

