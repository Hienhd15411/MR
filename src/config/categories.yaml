# ============================================================================
# V-APP STRATEGIC THEMES (editor-in-chief curation lens)
# ============================================================================
#
# Articles must touch at least ONE of these themes (with a business signal)
# to make it into the report. Vertical match + business signal is no longer
# sufficient on its own — themes filter for "what affects V-app's super-app
# strategy", not "what's in the e-commerce vertical generally".
#
# Each theme has a `weight` (1–5). Higher weight → higher CEO priority.
# Total `relevance_score` = sum of matched theme weights + bonuses for
# tracked-player and adjacent-player mentions.
#
# Tier A (weight 5) — core super-app battle: payment, commerce platform,
#   regulation that hits commission/license, big-tech competition
