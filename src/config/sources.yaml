  # ----- International -----
  - key: techcrunch
    name: "TechCrunch"
    crawler: rss
    rss_url: "https://techcrunch.com/feed/"
    scope: international
    type: market_pulse

  - key: theverge
    name: "The Verge"
    crawler: rss
    rss_url: "https://www.theverge.com/rss/index.xml"
    scope: international
    type: market_pulse

  - key: bloomberg_tech
    name: "Bloomberg Technology"
    crawler: rss
    # Bloomberg is heavily paywalled; the public RSS gives titles + summaries.
    rss_url: "https://feeds.bloomberg.com/technology/news.rss"
    scope: international
    type: market_pulse

  - key: reuters_tech
    name: "Reuters Technology"
    crawler: rss
    # Reuters often blocks scrapers. Public Google News query as fallback.
    rss_url: "https://news.google.com/rss/search?q=site:reuters.com+technology&hl=en-US"
    scope: international
    type: market_pulse

  - key: techinasia
    name: "Tech in Asia"
    crawler: rss
    rss_url: "https://www.techinasia.com/feed"
    scope: international
    type: market_pulse

  - key: krasia
