    scope: international
    type: market_pulse

  - key: e27
    name: "e27"
    crawler: rss
    rss_url: "https://e27.co/feed/"
    scope: international
    type: market_pulse

# Players Movement sources — newsroom / blog pages of focal players.
# These rarely have RSS, so they use Playwright + httpx fallback.
players:
  - key: momo
    name: "MoMo Newsroom"
    crawler: playwright
    module: src.crawlers.players.momo:MoMoNewsroom
    scope: domestic
    type: players_movement
    player: MoMo

  - key: grab_vn_blog
    name: "Grab VN Blog"
    crawler: playwright
    module: src.crawlers.players.grab:GrabVNBlog
    scope: domestic
    type: players_movement
    player: Grab
