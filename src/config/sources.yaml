# All sources used by the auto-crawl pipeline.
#
# crawler:
#   rss        → src.crawlers.rss.RSSCrawler (default; very stable)
#   playwright → src.crawlers.playwright_html.PlaywrightHtmlCrawler
#                (used for SPAs / paywalled sites — see players below)
#
# scope: domestic | international
# type:  market_pulse | players_movement
#
# RSS feeds prioritised whenever possible because they are far more stable
# than HTML scraping. Sites without a public RSS are scheduled with
# Playwright in src/crawlers/players/ instead.

news:
  # ----- Vietnam -----
  - key: vnexpress_sohoa
    name: "VnExpress – Số hoá"
    crawler: rss
    rss_url: "https://vnexpress.net/rss/so-hoa.rss"
    scope: domestic
    type: market_pulse

  - key: vnexpress_kinhdoanh
    name: "VnExpress – Kinh doanh"
    crawler: rss
    rss_url: "https://vnexpress.net/rss/kinh-doanh.rss"
    scope: domestic
    type: market_pulse

  - key: tuoitre_nhipsongso
    name: "Tuổi Trẻ – Nhịp sống số"
    crawler: rss
    rss_url: "https://tuoitre.vn/rss/nhip-song-so.rss"
    scope: domestic
    type: market_pulse

  - key: tuoitre_kinhdoanh
    name: "Tuổi Trẻ – Kinh doanh"
