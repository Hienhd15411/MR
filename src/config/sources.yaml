# 36 sources from Market Watch Crawler Instructions v2 — Section 1.
# priority: 0 = player official blog (always KEEP, Players Movement)
#           1 = Tier-1 tech media
#           2 = mid-tier
#           3 = clickbait-prone (lowest dedup priority)
#
# crawler: rss        → src.crawlers.rss.RSSCrawler (known feed)
#          html        → src.crawlers.html_listing.HtmlListingCrawler
#          playwright  → src.crawlers.players.* (SPA player blogs)
#
# scope default by source; geographic sub_topic_group is recomputed
# per-article by the filter (Section 2.5).

news:
  # ---------- Priority 1 — Tier-1 tech media ----------
