name: Market Watch crawl

on:
  workflow_dispatch:
    inputs:
      window_days:
        description: "Days back to include from RSS feeds"
        required: false
        default: "7"
  # Production schedule: Sunday 23:00 UTC = Monday 06:00 ICT
  schedule:
    - cron: "0 23 * * 0"
  # Manual on-demand: push a change to .crawl-trigger to fire a run.
  # Other code commits won't trigger thanks to paths filter.
  push:
    branches: [claude/market-watch-crawler-Bhj7D]
    paths:
      - ".crawl-trigger"

permissions:
  contents: write

concurrency:
  group: market-watch-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CRAWL_WINDOW_DAYS: ${{ github.event.inputs.window_days || '7' }}
      LOG_LEVEL: INFO
      # Always crawl fresh in CI; the local .cache/ is dev-only.
      CRAWL_CACHE: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run unit tests
        run: pytest -q

      - name: Run crawl pipeline
        run: |
          mkdir -p output logs
          python -m src.main \
            --excel output/raw_data.xlsx \
            --markdown output/raw_data.md

      - name: Upload artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-watch-${{ github.run_id }}
          path: |
            output/
            logs/
          if-no-files-found: warn
          retention-days: 30

      - name: Commit results back to repo
        # Run on both manual and scheduled runs so CEO has fresh data
        # every Monday morning without needing to tải artifact.
        if: success() && github.event_name != 'pull_request'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/raw_data.xlsx output/raw_data.md
          if git diff --cached --quiet; then
            echo "No changes in output/ — skipping commit."
            exit 0
          fi
          # [skip ci] guards against re-triggering on commits that may
          # eventually wire a push trigger.
          git commit -m "ci: weekly Market Watch crawl ${{ github.run_id }} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
